<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BakeIT Instructor Dashboard</title>
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="main-sidebar" aria-label="Navigation">
      <div class="sidebar-brand">
        <a class="wordmark" href="/dashboard.html" aria-label="BakeIT Instructor Dashboard"><span class="logo-frame"><img class="brand-logo" src="/assets/images/bakeit-logo-chef.png" alt="BakeIT" width="2000" height="2000"></span></a>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="/dashboard.html"><span>Dashboard</span></a>
        <a href="/students.html"><span>Learners</span></a>
        <a href="/sessions.html"><span>Live sessions</span></a>
        <a href="/reports.html"><span>Reports</span></a>
      </nav>
      <div class="account-actions">
        <div class="account-profile" role="group" aria-label="Instructor profile">
          <span class="account-avatar" data-profile-initials aria-hidden="true">I</span>
          <div class="account-details"><span class="account-name" data-profile-name>Instructor</span><span class="account-email" data-profile-email hidden></span></div>
        </div>
        <button class="btn quiet" data-logout>Sign out</button>
      </div>
    </aside>
    <button class="nav-overlay" data-nav-overlay type="button" tabindex="-1" aria-label="Close navigation" hidden></button>
    <div class="mobile-header"><a class="wordmark" href="/dashboard.html" aria-label="BakeIT Instructor Dashboard"><span class="logo-frame"><img class="brand-logo" src="/assets/images/bakeit-logo-chef.png" alt="BakeIT" width="2000" height="2000"></span></a><button class="btn" type="button" data-nav-toggle aria-controls="main-sidebar" aria-expanded="false">Menu</button></div>
    <main class="main">
      <div class="page-head"><h1>Reports</h1><div class="page-actions"><select data-section-select aria-label="Class section"></select></div></div>
      <section class="report-grid">
        <article class="card report">
          <h2>Class performance</h2>
          <ul class="report-contents"><li>Scores and completion</li><li>Safety and waste</li><li>Procedural accuracy</li></ul>
          <div class="report-action">
            <button class="btn primary" type="button" data-export aria-haspopup="dialog" aria-controls="report-dialog" disabled>Prepare report</button>
            <a class="report-template" href="/assets/reports/section-report-template.xlsx" download>Download Excel template</a>
          </div>
          <p class="feedback" data-report-status role="status" aria-live="polite"></p>
        </article>
      </section>
      <dialog id="report-dialog" class="class-dialog report-dialog" data-report-dialog aria-labelledby="report-dialog-title" aria-describedby="report-description">
        <form data-report-form>
          <h2 id="report-dialog-title">Prepare report?</h2>
          <p id="report-description" class="report-description" data-report-description></p>
          <p class="error" data-report-error role="alert" tabindex="-1"></p>
          <div class="dialog-actions"><button class="btn quiet" type="button" data-cancel-report>Cancel</button><button class="btn primary" type="submit" data-confirm-report autofocus>Prepare report</button></div>
        </form>
      </dialog>
    </main>
  </div>
  <script type="module" src="/assets/js/reports.js"></script>
</body>
</html>
