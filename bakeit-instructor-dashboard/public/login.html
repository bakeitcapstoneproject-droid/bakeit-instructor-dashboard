<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BakeIT Instructor Dashboard</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>
  <main class="login-page">
    <section class="login-art">
      <div class="login-logo logo-frame"><img src="/assets/images/bakeit-logo-current.png" alt="BakeIT" width="2000" height="2000"></div>
      <div class="login-intro"><p class="login-subtitle">Mapúa Malayan Colleges Laguna | Hospitality Management</p></div>

    </section>
    <section class="login-main">
      <div class="card login-card"><div class="login-card-logo logo-frame"><img src="/assets/images/bakeit-logo-current.png" alt="BakeIT" width="2000" height="2000"></div>
        <section data-auth-view="login">

          <h2>Instructor sign-in</h2>
          <form id="login-form" novalidate>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-input">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="password-toggle" type="button" data-toggle-password aria-controls="password" aria-label="Show password">Show</button>
              </div>
            </div>
            <div class="forgot-row"><button class="link-button" type="button" data-forgot>Forgot password?</button></div>
            <p class="error" id="login-error" data-login-error aria-live="polite"></p>
            <button class="btn primary" type="submit">Sign in</button>
          </form>

        </section>

        <section data-auth-view="recovery" hidden>
          <div data-reset-step="request">

            <h2>Forgot password</h2>
            <p class="sub">Enter your email to receive a verification code.</p>
            <form id="request-reset-form">
              <div class="field"><label for="reset-email">Email</label><input id="reset-email" name="resetEmail" type="email" autocomplete="email" required></div>
              <p class="error" data-request-error aria-live="polite"></p>
              <button class="btn primary" type="submit">Send verification code</button>
            </form>
            <button class="link-button back-link" type="button" data-back-login>Back to sign-in</button>
          </div>

          <div data-reset-step="confirm" hidden>

            <h2>Create a new password</h2>
            <p class="sub reset-message">Enter the code sent to <strong data-reset-email></strong>.</p>
            <form id="confirm-reset-form">
              <div class="field"><label for="reset-code">Verification code</label><input id="reset-code" name="resetCode" type="text" inputmode="numeric" maxlength="6" value="123456" autocomplete="one-time-code" required></div>
              <div class="field"><label for="new-password">New password</label><input id="new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
              <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
              <p class="error" data-confirm-error aria-live="polite"></p>
              <button class="btn primary" type="submit">Change password</button>
            </form>
            <button class="link-button back-link" type="button" data-back-request>Use a different email</button>
          </div>

          <div data-reset-step="success" class="reset-success" hidden>

            <h2>Password changed</h2>
            <p class="sub">Your password has been updated. You may now sign in with your new password.</p>
            <button class="btn primary" type="button" data-return-login>Return to sign-in</button>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
